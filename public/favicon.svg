<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0a"/>
  
  <!-- Stack layers (bottom to top) -->
  <rect x="4" y="22" width="24" height="3" rx="0.5" fill="url(#glow)" opacity="0.5"/>
  <rect x="5" y="18" width="22" height="3" rx="0.5" fill="url(#glow)" opacity="0.6"/>
  <rect x="6" y="14" width="20" height="3" rx="0.5" fill="url(#glow)" opacity="0.7"/>
  <rect x="7" y="10" width="18" height="3" rx="0.5" fill="url(#glow)" opacity="0.8"/>
  <rect x="8" y="6" width="16" height="3" rx="0.5" fill="url(#glow)" opacity="0.9"/>
  <rect x="10" y="2" width="12" height="3" rx="0.5" fill="url(#glow)" opacity="1"/>
  
  <!-- Central beam -->
  <rect x="15" y="2" width="2" height="24" fill="#00d4ff" opacity="0.8"/>
</svg>
